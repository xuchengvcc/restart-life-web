# Nginx配置示例 - 添加安全头和静态资源处理
# 将此配置添加到你的nginx站点配置中

# 添加安全头
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# 前端静态资源目录配置
location / {
    try_files $uri $uri/ /index.html;

    # 针对前端构建的静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;

        # 如果文件不存在，返回404而不是重定向到index.html
        try_files $uri =404;
    }
}

# 特殊处理：vite.svg等开发时的资源
location = /vite.svg {
    # 如果vite.svg不存在，返回一个默认的SVG图标
    try_files $uri @fallback_icon;
}

location @fallback_icon {
    add_header Content-Type "image/svg+xml";
    return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎮</text></svg>';
}

# 针对HTML页面的缓存策略
location ~* \.(html)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# 针对API请求的缓存策略
location /api/ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header X-Content-Type-Options nosniff always;

    # 这里添加你的后端代理配置
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 安全配置
server_tokens off;  # 隐藏nginx版本信息
