services:
  # 前端开发服务
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: restart-life-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8081
    stdin_open: true
    tty: true
    restart: unless-stopped

  # 前端生产服务
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: restart-life-frontend-prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:80"
      - "8444:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL证书挂载（生产环境）
      - /etc/nginx/asecondchance.cn_bundle.crt:/etc/nginx/ssl/cert.pem:ro
      - /etc/nginx/asecondchance.cn.key:/etc/nginx/ssl/key.pem:ro
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    external: true
    name: docker_restart-network
